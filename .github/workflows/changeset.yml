name: Changeset

# Keeps user-visible changes tracked: PRs titled feat/fix must add a .changeset
# fragment and PRs titled release must change CHANGELOG.md, so the release fold
# cannot come up empty. The `edited` trigger re-runs the gate when only the
# PR title changes.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog artifact present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check changelog artifacts
        run: node scripts/check-changeset.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
