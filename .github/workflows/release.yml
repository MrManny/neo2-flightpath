name: Release

# Lint and test gate the workflow; when they pass, two independent jobs run:
# publishing to npm and attaching the desktop app artifacts (Windows portable
# exe, Linux AppImage) to the GitHub Release. A failure in one does not block
# the other; each job can be re-run on its own.
#
# Auth works in two phases (see README "Releasing"):
#   1. Bootstrap: the package does not exist on npm yet, so OIDC trusted
#      publishing cannot be configured. Add a granular, package-scoped
#      automation token as the NPM_TOKEN repository secret; the publish below
#      then uses it (with --provenance).
#   2. Trusted publishing: once the package exists, configure the trusted
#      publisher on npmjs.com (workflow filename: release.yml), then delete
#      the NPM_TOKEN secret. With the secret gone, publishing switches to
#      token-free OIDC automatically (and provenance is generated by npm).
#
# Prerelease GitHub releases are skipped. The release tag must match the
# version in package.json (leading "v" optional).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: Lint and test
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$pkg_version'"
            exit 1
          fi

      - name: Publish to npm (trusted publishing)
        if: env.HAS_NPM_TOKEN == 'false'
        run: npm publish --access public

      - name: Publish to npm (NPM_TOKEN fallback)
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  desktop:
    name: Desktop app (${{ matrix.label }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: win-x64
            target: --win portable
            artifact: dist-electron/*.exe
          - os: ubuntu-latest
            label: linux-x86_64
            target: --linux AppImage
            artifact: dist-electron/*.AppImage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$pkg_version'"
            exit 1
          fi

      - name: Build desktop app
        run: npm run app:pack -- ${{ matrix.target }}

      - name: Attach artifact to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.artifact }} --clobber